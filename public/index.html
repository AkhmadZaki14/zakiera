<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zakiera</title>
<style>
:root{--bg:#0e0e11;--p:#16161b;--p2:#1d1d24;--bd:#2a2a33;--tx:#e8e8ee;--mu:#8a8a98;--ac:#7c83ff;--ok:#4ade80;--er:#f87171;--wa:#fbbf24}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:14px/1.4 Inter,system-ui,sans-serif;display:grid;grid-template-columns:230px 1fr;gap:10px;padding:10px}
h2{font-size:13px;font-weight:600;margin-bottom:8px}
.panel{background:var(--p);border:1px solid var(--bd);border-radius:6px;padding:10px}
.side{display:flex;flex-direction:column;gap:8px}
#list{flex:1;overflow:auto;min-height:160px}
.bot{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:4px;cursor:pointer}
.bot:hover{background:var(--p2)}.bot.sel{background:var(--p2);outline:1px solid var(--ac)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mu);flex:none}.dot.on{background:var(--ok)}
.bot small{color:var(--mu);margin-left:auto}
input[type=text]{width:100%;background:var(--p2);border:1px solid var(--bd);color:var(--tx);padding:7px 9px;border-radius:4px;font:inherit}
button{background:var(--p2);border:1px solid var(--bd);color:var(--tx);padding:7px 12px;border-radius:4px;font:inherit;cursor:pointer}
button:hover{border-color:var(--ac)}button:active{background:var(--ac);color:#fff}
.main{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto auto 1fr;gap:10px;min-width:0}
.row{display:flex;gap:6px;margin-top:8px}
.kv{display:grid;grid-template-columns:90px 1fr;row-gap:3px}.kv span:nth-child(odd){color:var(--mu)}
.pill{padding:1px 8px;border-radius:10px;background:var(--p2);font-size:12px}
.pill.on{color:var(--ok)}.pill.off{color:var(--er)}
.dpad{display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(3,48px);gap:6px;justify-content:center}
.dpad button{height:100%}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;max-width:300px;margin:0 auto}
.cell{aspect-ratio:1;font-size:11px;color:var(--mu)}
.cell.me{background:var(--ac);color:#fff;border-color:var(--ac)}
.cell.pend{outline:2px solid var(--wa)}
.chk{display:flex;gap:8px;align-items:center;padding:3px 0;cursor:pointer}
.chk input{accent-color:var(--ac)}
#log{grid-column:1/3;overflow:auto;font:12px ui-monospace,Menlo,monospace;color:var(--mu);min-height:120px;max-height:220px}
#log div{padding:1px 0}#log .e{color:var(--er)}
@media(max-width:760px){body{grid-template-columns:1fr}.main{grid-template-columns:1fr}#log{grid-column:auto}}
</style>
</head>
<body>
<div class="side">
  <div class="panel" id="list"><h2>Bot</h2><div id="bots"></div></div>
  <div class="panel">
    <h2>Perintah ke semua bot</h2>
    <label class="chk"><input type="checkbox" id="all"> Kirim ke semua bot online</label>
  </div>
</div>

<div class="main">
  <div class="panel">
    <h2 id="title">Belum ada bot dipilih</h2>
    <div class="kv">
      <span>Status</span><span id="st">-</span>
      <span>World</span><span id="wd">-</span>
      <span>Posisi</span><span id="ps">-</span>
      <span>Level</span><span id="lv">-</span>
      <span>Gems</span><span id="gm">-</span>
    </div>
    <div class="row"><input type="text" id="world" placeholder="Nama world"><button id="warp">Warp</button></div>
    <div class="row"><button id="conn">Connect</button><button id="disc">Disconnect</button></div>
  </div>

  <div class="panel">
    <h2>Gerak (tombol panah atau WASD juga bisa)</h2>
    <div class="dpad">
      <span></span><button data-d="0,-1">Atas</button><span></span>
      <button data-d="-1,0">Kiri</button><button id="use">Pakai</button><button data-d="1,0">Kanan</button>
      <span></span><button data-d="0,1">Bawah</button><span></span>
    </div>
  </div>

  <div class="panel">
    <h2>Pengaturan</h2>
    <label class="chk"><input type="checkbox" id="cfg-modfly" checked> Modfly (wajib aktif)</label>
    <label class="chk"><input type="checkbox" id="cfg-rec"> Auto reconnect</label>
    <label class="chk"><input type="checkbox" id="cfg-safe" checked> Cek tile aman sebelum jalan</label>
    <h2 style="margin-top:10px">Kecepatan polling</h2>
    <div class="kv"><span>Web</span><span id="hz">-</span></div>
  </div>

  <div class="panel">
    <h2>Grid path 5x5 (klik tile untuk jalan, tengah = posisi bot)</h2>
    <div class="grid5" id="grid"></div>
  </div>

  <div class="panel" id="log"></div>
</div>

<script>
// ====== Sesuaikan endpoint dengan server.js ======
const API = 'http://127.0.0.1:3001';                    // kalau dibuka dari file lokal, ganti ke URL server
const EP = {
  bots:    () => API + '/api/bots',             // GET  -> { bots:[{id,x,y,world,status,level,gems,online}] }
  command: () => API + '/api/command'           // POST -> { botId, type, payload }
};
const POLL_MS = 300;

let bots = [], sel = null;
let pend = {};            // botId -> { x, y, t }  target tertunda, supaya spam klik menumpuk dari target, bukan dari posisi lama
const $ = id => document.getElementById(id);
const hdr = { 'Content-Type':'application/json', 'ngrok-skip-browser-warning':'1' };

function log(m, err){
  const d = document.createElement('div'); if(err) d.className='e';
  d.textContent = '[' + new Date().toLocaleTimeString('id-ID') + '] ' + m;
  $('log').prepend(d); while($('log').children.length > 150) $('log').lastChild.remove();
}
const cur = () => bots.find(b => b.id === sel);
const targets = () => $('all').checked ? bots.filter(b => b.online) : (cur() ? [cur()] : []);

async function send(bot, type, payload){
  try{
    const r = await fetch(EP.command(), { method:'POST', headers:hdr, body:JSON.stringify({ botId:bot.id, type, payload:payload||{} }) });
    if(!r.ok) throw new Error(r.status);
  }catch(e){ log('Gagal kirim ' + type + ' ke ' + bot.id, true); }
}

// Gerak: target dihitung dari target tertunda jika masih baru (<2 dtk), jadi 5x klik = 5 tile
function move(dx, dy){
  targets().forEach(b => {
    const p = pend[b.id], base = (p && Date.now() - p.t < 2000) ? p : b;
    const x = base.x + dx, y = base.y + dy;
    pend[b.id] = { x, y, t: Date.now() };
    send(b, 'move', { x, y, safe: $('cfg-safe').checked, modfly: $('cfg-modfly').checked });
    log(b.id + ' jalan ke (' + x + ',' + y + ')');
  });
  render();
}

// Grid 5x5
const grid = $('grid');
for(let dy=-2; dy<=2; dy++) for(let dx=-2; dx<=2; dx++){
  const c = document.createElement('button');
  c.className = 'cell' + (!dx && !dy ? ' me' : '');
  c.dataset.dx = dx; c.dataset.dy = dy;
  c.onclick = () => { if(dx||dy) move(dx, dy); };
  grid.appendChild(c);
}

function render(){
  const list = $('bots'); list.innerHTML = '';
  bots.forEach(b => {
    const d = document.createElement('div');
    d.className = 'bot' + (b.id === sel ? ' sel' : '');
    d.innerHTML = '<span class="dot ' + (b.online ? 'on' : '') + '"></span>' + b.id + '<small>' + b.x + ',' + b.y + '</small>';
    d.onclick = () => { sel = b.id; render(); };
    list.appendChild(d);
  });
  if(!list.children.length) list.innerHTML = '<div style="color:var(--mu)">Belum ada bot online. Jalankan zakiera_loader.lua di Bothax.</div>';

  const b = cur();
  $('title').textContent = b ? b.id : 'Belum ada bot dipilih';
  if(b){
    $('st').innerHTML = '<span class="pill ' + (b.online ? 'on' : 'off') + '">' + (b.online ? 'Online' : 'Offline') + '</span>';
    $('wd').textContent = b.world || '-';
    $('ps').textContent = b.x + ', ' + b.y;
    $('lv').textContent = b.level || '-';
    $('gm').textContent = b.gems ? b.gems.toLocaleString('id-ID') : '-';
    const p = pend[b.id], fresh = p && Date.now() - p.t < 2000;
    document.querySelectorAll('.cell').forEach(c => {
      const dx = +c.dataset.dx, dy = +c.dataset.dy;
      c.textContent = (b.x + dx) + ',' + (b.y + dy);
      c.classList.toggle('pend', !!(fresh && p.x === b.x+dx && p.y === b.y+dy));
    });
  }
}

async function poll(){
  const t0 = performance.now();
  try{
    const r = await fetch(EP.bots(), { headers:hdr, cache:'no-store' });
    bots = (await r.json()).bots || [];
    if(!sel && bots.length) sel = bots[0].id;
    $('hz').textContent = Math.round(performance.now() - t0) + ' ms';
    render();
  }catch(e){ $('hz').textContent = 'putus'; }
  setTimeout(poll, POLL_MS);
}

document.querySelectorAll('[data-d]').forEach(btn => btn.onclick = () => { const [x,y] = btn.dataset.d.split(',').map(Number); move(x, y); });
$('use').onclick = () => targets().forEach(b => { send(b, 'use'); log(b.id + ' pakai'); });
$('warp').onclick = () => { const w = $('world').value.trim().toUpperCase(); if(!w) return; targets().forEach(b => { send(b, 'warp', { world:w }); log(b.id + ' warp ke ' + w); }); };
$('conn').onclick = () => targets().forEach(b => send(b, 'connect'));
$('disc').onclick = () => targets().forEach(b => send(b, 'disconnect'));
$('cfg-modfly').onchange = e => targets().forEach(b => send(b, 'modfly', { on:e.target.checked }));
$('cfg-rec').onchange = e => targets().forEach(b => send(b, 'autoreconnect', { on:e.target.checked }));

log('Zakiera siap');
poll();
</script>
</body>
</html>
