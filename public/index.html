<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ZAKIERA — GT Bot Control</title>
<style>
/* ── Reset & base ─────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg0:     #0b0b0f;
  --bg1:     #111118;
  --bg2:     #18181f;
  --bg3:     #1e1e28;
  --border:  #2a2a38;
  --accent:  #5b6af0;
  --accent2: #7c89ff;
  --green:   #3ecf8e;
  --red:     #f05b5b;
  --yellow:  #f0c65b;
  --text:    #d4d4e0;
  --dim:     #6b6b80;
  --radius:  6px;
}

html, body { height: 100%; background: var(--bg0); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; }

/* ── Layout ───────────────────────────────────────────────── */
.app { display: grid; grid-template-columns: 260px 1fr; grid-template-rows: 48px 1fr; height: 100vh; gap: 0; }

/* Header */
.header {
  grid-column: 1 / -1;
  background: var(--bg1);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; padding: 0 16px; gap: 12px;
}
.header-logo { font-size: 16px; font-weight: 700; color: var(--accent2); letter-spacing: 1px; }
.header-badge {
  padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: 700;
  text-transform: uppercase; letter-spacing: .5px;
  background: rgba(240,91,91,.15); color: var(--red); border: 1px solid rgba(240,91,91,.3);
  transition: all .3s;
}
.header-badge.online { background: rgba(62,207,142,.15); color: var(--green); border-color: rgba(62,207,142,.3); }
.header-world { margin-left: auto; color: var(--dim); font-size: 12px; }
.header-world span { color: var(--text); font-weight: 600; }

/* Sidebar */
.sidebar {
  background: var(--bg1);
  border-right: 1px solid var(--border);
  padding: 14px 12px;
  display: flex; flex-direction: column; gap: 12px;
  overflow-y: auto;
}

/* Main */
.main { padding: 14px; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; }

/* ── Cards ────────────────────────────────────────────────── */
.card {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 12px;
}
.card-title {
  font-size: 10px; font-weight: 700; text-transform: uppercase;
  letter-spacing: .8px; color: var(--dim); margin-bottom: 10px;
}

/* ── Stats grid ───────────────────────────────────────────── */
.stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.stat-item {
  background: var(--bg3); border-radius: 4px; padding: 8px 10px;
}
.stat-label { font-size: 10px; color: var(--dim); margin-bottom: 2px; }
.stat-value { font-size: 15px; font-weight: 700; color: var(--text); }
.stat-value.accent { color: var(--accent2); }
.stat-value.green  { color: var(--green); }
.stat-value.yellow { color: var(--yellow); }

/* ── Live coord bar ───────────────────────────────────────── */
.coord-bar {
  display: flex; align-items: center; justify-content: center;
  gap: 6px; padding: 6px 10px; background: var(--bg3);
  border-radius: 4px; font-size: 12px; color: var(--dim);
}
.coord-bar .coord-val { font-weight: 700; color: var(--accent2); font-size: 14px; }

/* ── 5x5 Grid ─────────────────────────────────────────────── */
.grid-wrap { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.grid-label { font-size: 10px; color: var(--dim); }
.tile-grid {
  display: grid;
  grid-template-columns: repeat(5, 44px);
  grid-template-rows:    repeat(5, 44px);
  gap: 3px;
}
.tile {
  background: var(--bg3); border: 1px solid var(--border);
  border-radius: 4px; cursor: pointer; position: relative;
  display: flex; align-items: center; justify-content: center;
  font-size: 9px; color: var(--dim);
  transition: background .12s, border-color .12s;
  user-select: none;
}
.tile:hover { background: var(--bg1); border-color: var(--accent); color: var(--accent2); }
.tile.center {
  background: rgba(91,106,240,.2);
  border: 2px solid var(--accent);
  color: var(--accent2);
  font-weight: 700;
  font-size: 14px;
  cursor: default;
}
.tile.targeted {
  background: rgba(62,207,142,.15);
  border-color: var(--green);
  color: var(--green);
}
.tile .coord-hint { font-size: 8px; line-height: 1.1; text-align: center; }

/* ── D-pad ────────────────────────────────────────────────── */
.dpad { display: grid; grid-template-columns: repeat(3, 44px); grid-template-rows: repeat(3, 44px); gap: 3px; }
.dpad-btn {
  background: var(--bg3); border: 1px solid var(--border);
  border-radius: 4px; cursor: pointer; font-size: 16px;
  display: flex; align-items: center; justify-content: center;
  transition: background .1s, transform .1s;
  user-select: none;
}
.dpad-btn:hover { background: var(--bg1); border-color: var(--accent); }
.dpad-btn:active { transform: scale(.92); background: rgba(91,106,240,.2); }
.dpad-btn.empty { background: transparent; border: none; cursor: default; }
.dpad-btn.use-btn { font-size: 10px; font-weight: 700; color: var(--yellow); border-color: rgba(240,198,91,.3); }

/* ── Warp ─────────────────────────────────────────────────── */
.warp-row { display: flex; gap: 6px; }
.warp-row input {
  flex: 1; background: var(--bg3); border: 1px solid var(--border);
  border-radius: 4px; padding: 7px 10px; color: var(--text);
  font-size: 12px; text-transform: uppercase; outline: none;
}
.warp-row input:focus { border-color: var(--accent); }
.warp-row input::placeholder { color: var(--dim); text-transform: none; }

/* ── Buttons ──────────────────────────────────────────────── */
.btn {
  padding: 8px 14px; border-radius: 4px; font-size: 12px; font-weight: 600;
  cursor: pointer; border: none; transition: opacity .1s, transform .1s;
  white-space: nowrap;
}
.btn:active { transform: scale(.96); }
.btn-primary  { background: var(--accent);  color: #fff; }
.btn-primary:hover { opacity: .85; }
.btn-danger   { background: var(--red);     color: #fff; }
.btn-danger:hover  { opacity: .85; }
.btn-success  { background: var(--green);   color: #000; }
.btn-success:hover { opacity: .85; }
.btn-ghost    { background: var(--bg3); border: 1px solid var(--border); color: var(--text); }
.btn-ghost:hover { border-color: var(--accent); }
.btn-full { width: 100%; }

/* ── Log ──────────────────────────────────────────────────── */
.log-box {
  background: var(--bg0); border: 1px solid var(--border);
  border-radius: 4px; padding: 8px; height: 120px; overflow-y: auto;
  font-family: monospace; font-size: 11px; color: var(--dim);
  line-height: 1.5;
}
.log-box .log-ok  { color: var(--green); }
.log-box .log-err { color: var(--red); }
.log-box .log-cmd { color: var(--accent2); }

/* ── Flash feedback ───────────────────────────────────────── */
@keyframes flash { 0%,100%{opacity:1} 50%{opacity:.4} }
.flashing { animation: flash .4s ease; }

/* ── Scrollbar ────────────────────────────────────────────── */
::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
</style>
</head>
<body>
<div class="app">

  <!-- HEADER -->
  <header class="header">
    <div class="header-logo">⚡ ZAKIERA</div>
    <div class="header-badge" id="online-badge">OFFLINE</div>
    <div class="header-world">World: <span id="hdr-world">—</span></div>
  </header>

  <!-- SIDEBAR -->
  <aside class="sidebar">

    <!-- Stats -->
    <div class="card">
      <div class="card-title">Bot Stats</div>
      <div class="stats-grid">
        <div class="stat-item">
          <div class="stat-label">Status</div>
          <div class="stat-value" id="stat-status">—</div>
        </div>
        <div class="stat-item">
          <div class="stat-label">World</div>
          <div class="stat-value accent" id="stat-world">—</div>
        </div>
        <div class="stat-item">
          <div class="stat-label">Level</div>
          <div class="stat-value yellow" id="stat-level">—</div>
        </div>
        <div class="stat-item">
          <div class="stat-label">Gems</div>
          <div class="stat-value green" id="stat-gems">—</div>
        </div>
      </div>
    </div>

    <!-- Live Position -->
    <div class="card">
      <div class="card-title">Live Position</div>
      <div class="coord-bar">
        X&nbsp;<span class="coord-val" id="live-x">—</span>
        &nbsp;/&nbsp;
        Y&nbsp;<span class="coord-val" id="live-y">—</span>
      </div>
    </div>

    <!-- D-Pad -->
    <div class="card">
      <div class="card-title">D-Pad Movement</div>
      <div style="display:flex;justify-content:center;">
        <div class="dpad">
          <div class="dpad-btn empty"></div>
          <div class="dpad-btn" id="btn-up"    onclick="sendMove(0,-1)">▲</div>
          <div class="dpad-btn empty"></div>
          <div class="dpad-btn" id="btn-left"  onclick="sendMove(-1,0)">◄</div>
          <div class="dpad-btn use-btn"         onclick="sendUse()">USE</div>
          <div class="dpad-btn" id="btn-right"  onclick="sendMove(1,0)">►</div>
          <div class="dpad-btn empty"></div>
          <div class="dpad-btn" id="btn-down"   onclick="sendMove(0,1)">▼</div>
          <div class="dpad-btn empty"></div>
        </div>
      </div>
    </div>

    <!-- Warp -->
    <div class="card">
      <div class="card-title">Warp to World</div>
      <div class="warp-row">
        <input id="warp-input" type="text" placeholder="World name..." maxlength="24"/>
        <button class="btn btn-primary" onclick="sendWarp()">GO</button>
      </div>
    </div>

    <!-- Connect / Disconnect -->
    <div class="card">
      <div class="card-title">Session</div>
      <div style="display:flex;gap:6px;">
        <button class="btn btn-success btn-full" onclick="sendCmd('connect',{})">Connect</button>
        <button class="btn btn-danger  btn-full" onclick="sendCmd('disconnect',{})">Disconnect</button>
      </div>
    </div>

  </aside>

  <!-- MAIN -->
  <main class="main">

    <!-- 5x5 Path Grid -->
    <div class="card">
      <div class="card-title">5×5 Path Grid — click tile to move</div>
      <div class="grid-wrap">
        <div class="tile-grid" id="tile-grid"></div>
        <div class="grid-label">Center = bot position. Click any tile to pathfind there.</div>
      </div>
    </div>

    <!-- Log -->
    <div class="card" style="flex:1;display:flex;flex-direction:column;">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
        <div class="card-title" style="margin:0;">Command Log</div>
        <button class="btn btn-ghost" style="padding:4px 10px;font-size:11px;" onclick="clearLog()">Clear</button>
      </div>
      <div class="log-box" id="log-box"></div>
    </div>

  </main>
</div>

<script>
// ── Config ────────────────────────────────────────────────────
// Ganti BASE_URL kalau pakai ngrok/Vercel
const BASE_URL = 'http://127.0.0.1:3001';
const POLL_MS  = 1000; // interval poll status

// ── State ─────────────────────────────────────────────────────
let botX = 0, botY = 0;
let lastTargetDx = null, lastTargetDy = null;

// ── Build 5×5 grid ───────────────────────────────────────────
function buildGrid() {
  const grid = document.getElementById('tile-grid');
  grid.innerHTML = '';
  for (let row = 0; row < 5; row++) {
    for (let col = 0; col < 5; col++) {
      const dx = col - 2; // -2..+2
      const dy = row - 2;
      const tile = document.createElement('div');
      tile.className = 'tile' + (dx === 0 && dy === 0 ? ' center' : '');
      tile.dataset.dx = dx;
      tile.dataset.dy = dy;
      tile.id = `tile_${dx}_${dy}`;

      if (dx === 0 && dy === 0) {
        tile.textContent = '●';
      } else {
        const hint = document.createElement('div');
        hint.className = 'coord-hint';
        hint.id = `hint_${dx}_${dy}`;
        hint.textContent = '…';
        tile.appendChild(hint);
        tile.onclick = () => clickTile(dx, dy);
      }
      grid.appendChild(tile);
    }
  }
}

function updateGridCoords() {
  for (let row = 0; row < 5; row++) {
    for (let col = 0; col < 5; col++) {
      const dx = col - 2, dy = row - 2;
      if (dx === 0 && dy === 0) continue;
      const hint = document.getElementById(`hint_${dx}_${dy}`);
      if (hint) hint.textContent = `${botX + dx},${botY + dy}`;
    }
  }
  // Update center tile coord hint
  const center = document.getElementById('tile_0_0');
  if (center) center.title = `Bot: ${botX},${botY}`;
}

function clickTile(dx, dy) {
  const tx = botX + dx, ty = botY + dy;
  sendCmd('move', { x: tx, y: ty });
  log(`Move → (${tx},${ty})  [dx:${dx>0?'+':''}${dx} dy:${dy>0?'+':''}${dy}]`, 'log-cmd');

  // Visual feedback
  if (lastTargetDx !== null) {
    const old = document.getElementById(`tile_${lastTargetDx}_${lastTargetDy}`);
    if (old) old.classList.remove('targeted');
  }
  const tile = document.getElementById(`tile_${dx}_${dy}`);
  if (tile) tile.classList.add('targeted');
  lastTargetDx = dx; lastTargetDy = dy;
}

// ── D-pad / Use ───────────────────────────────────────────────
function sendMove(dx, dy) {
  const tx = botX + dx, ty = botY + dy;
  sendCmd('move', { x: tx, y: ty });
  log(`D-pad → (${tx},${ty})`, 'log-cmd');
  // Flash button
  const map = { '0,-1':'btn-up','0,1':'btn-down','-1,0':'btn-left','1,0':'btn-right' };
  const id = map[`${dx},${dy}`];
  if (id) flashEl(id);
}

function sendUse() {
  sendCmd('use', {});
  log('USE pressed', 'log-cmd');
}

// ── Warp ──────────────────────────────────────────────────────
function sendWarp() {
  const inp = document.getElementById('warp-input');
  const world = (inp.value || '').trim().toUpperCase();
  if (!world) return;
  sendCmd('warp', { world });
  log(`Warp → ${world}`, 'log-cmd');
  inp.value = '';
}

// ── API ───────────────────────────────────────────────────────
async function sendCmd(type, payload) {
  try {
    const r = await fetch(`${BASE_URL}/api/command`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ type, payload }),
    });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
  } catch (e) {
    log(`CMD error: ${e.message}`, 'log-err');
  }
}

async function pollStatus() {
  try {
    const r = await fetch(`${BASE_URL}/api/status`);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const d = await r.json();
    applyStatus(d);
  } catch (e) {
    setOffline();
  }
}

function applyStatus(d) {
  const online = d.online;

  // Header badge
  const badge = document.getElementById('online-badge');
  badge.textContent = online ? 'ONLINE' : 'OFFLINE';
  badge.className = 'header-badge' + (online ? ' online' : '');

  document.getElementById('hdr-world').textContent = d.world || '—';

  // Sidebar stats
  document.getElementById('stat-status').textContent = d.status || '—';
  document.getElementById('stat-world').textContent  = d.world  || '—';
  document.getElementById('stat-level').textContent  = d.level  || '—';
  document.getElementById('stat-gems').textContent   = fmtNum(d.gems);

  // Live position
  document.getElementById('live-x').textContent = d.x ?? '—';
  document.getElementById('live-y').textContent = d.y ?? '—';

  // Update grid if pos changed
  if (d.x !== botX || d.y !== botY) {
    botX = d.x || 0;
    botY = d.y || 0;
    updateGridCoords();
    // Clear old target marker (bot moved)
    if (lastTargetDx !== null) {
      const old = document.getElementById(`tile_${lastTargetDx}_${lastTargetDy}`);
      if (old) old.classList.remove('targeted');
      lastTargetDx = null; lastTargetDy = null;
    }
  }
}

function setOffline() {
  const badge = document.getElementById('online-badge');
  badge.textContent = 'OFFLINE';
  badge.className = 'header-badge';
}

// ── Helpers ───────────────────────────────────────────────────
function fmtNum(n) {
  n = Number(n) || 0;
  if (n >= 1e9) return (n/1e9).toFixed(2) + 'B';
  if (n >= 1e6) return (n/1e6).toFixed(1) + 'M';
  if (n >= 1e3) return (n/1e3).toFixed(0) + 'K';
  return n.toString();
}

function flashEl(id) {
  const el = document.getElementById(id);
  if (!el) return;
  el.classList.remove('flashing');
  void el.offsetWidth; // reflow
  el.classList.add('flashing');
  setTimeout(() => el.classList.remove('flashing'), 400);
}

const logBox = document.getElementById('log-box');
function log(msg, cls = '') {
  const ts = new Date().toLocaleTimeString('id-ID', { hour12: false });
  const line = document.createElement('div');
  if (cls) line.className = cls;
  line.textContent = `[${ts}] ${msg}`;
  logBox.appendChild(line);
  logBox.scrollTop = logBox.scrollHeight;
  // Keep max 200 lines
  while (logBox.children.length > 200) logBox.removeChild(logBox.firstChild);
}

function clearLog() { logBox.innerHTML = ''; }

// ── Init ──────────────────────────────────────────────────────
buildGrid();
pollStatus();
setInterval(pollStatus, POLL_MS);
log('ZAKIERA ready', 'log-ok');
</script>
</body>
</html>
